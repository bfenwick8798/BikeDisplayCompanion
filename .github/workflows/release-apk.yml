name: Build and Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate release signing key
        run: |
          keystore_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keystore_password"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$keystore_password" \
            -keypass "$keystore_password" \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=BikeDisplayCompanion"
          {
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PASSWORD=$keystore_password"
            echo "RELEASE_KEY_ALIAS=release"
            echo "RELEASE_KEY_PASSWORD=$keystore_password"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew clean test assembleRelease

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: BikeDisplayCompanion ${{ env.TAG_NAME }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
