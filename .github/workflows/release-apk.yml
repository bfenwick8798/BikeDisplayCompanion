name: Build and Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate release signing key
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass github-actions \
            -keypass github-actions \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=BikeDisplayCompanion"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: github-actions
          RELEASE_KEY_ALIAS: release
          RELEASE_KEY_PASSWORD: github-actions
        run: ./gradlew clean test assembleRelease

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: BikeDisplayCompanion ${{ env.TAG_NAME }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
